server:
  port: 8080

spring:
  application:
    name: mock-brevo

  datasource:
    url: jdbc:h2:file:${MOCK_BREVO_DB_PATH:./data/brevo};MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

  # The admin UI loads index.html, js/ and css/ as separate files with fixed
  # URLs. Without a Cache-Control header, a browser can keep an app.js from an
  # older image and pair it with a newer index.html (the FR/EN toggle then does
  # nothing). Send "no-cache" and no Last-Modified, so each page load gets the
  # files from the running image. A file date is not a safe check: two builds
  # can give the same file an older date.
  web:
    resources:
      cache:
        use-last-modified: false
        cachecontrol:
          no-cache: true

mock-brevo:
  reveal-keys: ${MOCK_STATUS_REVEAL_KEYS:true}
  default-webhook-url: ${MOCK_DEFAULT_WEBHOOK_URL:}
  auto-fire-delivered: ${MOCK_AUTO_FIRE_DELIVERED:false}
  webhook-token: ${MOCK_WEBHOOK_TOKEN:}
  smtp:
    enabled: ${MOCK_SMTP_ENABLED:false}
    host: ${MOCK_SMTP_HOST:localhost}
    port: ${MOCK_SMTP_PORT:1025}
    username: ${MOCK_SMTP_USERNAME:}
    password: ${MOCK_SMTP_PASSWORD:}
    starttls: ${MOCK_SMTP_STARTTLS:false}

logging:
  level:
    org.enoria.mockbrevo: INFO
    org.hibernate.SQL: WARN
