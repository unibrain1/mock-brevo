name: Claude code review

# Automatic PR review with anthropics/claude-code-action.
# Setup: run `/install-github-app` in Claude Code (installs the Claude GitHub App
# and stores CLAUDE_CODE_OAUTH_TOKEN), or install https://github.com/apps/claude
# and run `claude setup-token` + `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
# This file must be on the default branch before it runs on pull requests.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot PRs can't read repository secrets; drafts get reviewed once ready.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first; it documents the
            invariants this project depends on. In particular check that:
            - every /v3/** controller calls CurrentAccount.require() and scopes
              every query by account (no data leaks between api-keys);
            - JSON field names match Brevo's API exactly and request DTO records
              carry @JsonIgnoreProperties(ignoreUnknown = true);
            - methods that walk lazy JPA relations use Spring's
              org.springframework.transaction.annotation.Transactional, not
              jakarta.transaction.Transactional;
            - raw api-keys are never logged, and nothing sends real email;
            - admin UI strings go through I18N.t() with the key present in both
              the fr and en dictionaries of static/js/i18n.js, and dynamic values
              inserted into HTML are escaped with esc().

            Also look for bugs, security issues and missing tests. Skip pure
            style nits; linters cover formatting.

            Post specific problems as inline comments on the relevant lines, then
            post one short summary comment with `gh pr comment`. If there are no
            problems, say so in the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
