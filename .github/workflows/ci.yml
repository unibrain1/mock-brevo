name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Java lint & API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -Plint: javac -Xlint warnings fail the build, SpotBugs runs at verify.
      - name: Verify (lint + tests + package)
        run: ./mvnw -B -ntp -Plint verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: mock-brevo-jar
          path: target/mock-brevo-*.jar
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  ui-tests:
    name: Admin UI tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: mock-brevo-jar
          path: dist

      - name: Start mock-brevo
        run: |
          MOCK_BREVO_DB_PATH="$RUNNER_TEMP/brevo" nohup java -jar dist/mock-brevo-*.jar \
            --server.port=18080 > "$RUNNER_TEMP/mock-brevo.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:18080/mock-status >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/mock-brevo.log"
          exit 1

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:ui
        env:
          MOCK_BREVO_URL: http://localhost:18080

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: mock-brevo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image + hit /mock-status
        run: |
          docker run --rm -d --name mb -p 18080:8080 mock-brevo:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18080/mock-status >/dev/null; then
              echo "mock-brevo is up"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:18080/mock-status | head -c 200; echo
          curl -fsS -H 'api-key: ci-smoke' http://localhost:18080/v3/account | head -c 200; echo
          docker stop mb
