name: Claude code review

# Automatic PR review with Anthropic's official code-review plugin: parallel
# CLAUDE.md-compliance and bug-hunting agents, then a validation pass that drops
# anything it can't confirm, so only high-signal issues are posted inline.
# Repo-specific review rules live in CLAUDE.md (the plugin enforces them).
#
# The plugin reviews a PR once and skips PRs Claude has already commented on,
# so later pushes aren't re-reviewed; ask for another pass by commenting
# `@claude review this PR again` (handled by claude.yml).
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub App
# (`/install-github-app`). The action only runs when this file matches the
# copy on the default branch, so edits to it skip their own PR's review.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are reviewed when marked ready; Dependabot PRs can't read secrets.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record start time
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # This is a one-shot CI run: the session ends as soon as Claude stops, so
          # sub-agents launched in the background never report back.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This runs non-interactively in CI and the session ends when you stop.
            Run every sub-agent in the foreground (never in the background) and
            wait for its result before continuing, then finish all steps.
          # Step summary with Claude's report, so a review that stops early can be
          # diagnosed. Only write-access users trigger this workflow.
          display_report: true
          # The plugin command's own allowed-tools list, plus what its steps need:
          # Skill to run the plugin command, Agent/Task to launch its sub-agents,
          # TodoWrite (it starts with a todo list) and read-only tools to find
          # CLAUDE.md files.
          claude_args: >-
            --allowedTools "Skill,Agent,Task,TodoWrite,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

      # The plugin can decide a PR needs no review and stop without commenting.
      # Always leave a trace on the PR: if Claude posted nothing during this run,
      # post its final message (and any blocked tools) as a comment.
      - name: Comment if the review stayed silent
        if: always() && steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$REVIEW_STARTED" --jq '[.[] | select(.user.login | test("claude"; "i"))] | length')
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments?since=$REVIEW_STARTED" --jq 'length')
          if [ "$posted" != "0" ] || [ "$inline" != "0" ]; then
            echo "Claude commented ($posted comment(s), $inline inline); nothing to add."
            exit 0
          fi
          # -s + flatten reads the file whether it's a JSON array or JSON lines.
          result=$(jq -rs 'flatten | map(select(.type == "result")) | last | .result // "(no final message)"' "$EXECUTION_FILE")
          denied=$(jq -rs 'flatten | map(select(.type == "result")) | last | [.permission_denials[]?.tool_name] | unique | join(", ")' "$EXECUTION_FILE")
          {
            echo "## Claude code review"
            echo
            echo "The review finished without posting findings. Claude's final message:"
            echo
            printf '%s\n' "$result" | sed 's/^/> /'
            if [ -n "$denied" ]; then
              echo
              echo "Blocked tools: \`$denied\` (add them to \`--allowedTools\` in \`claude-code-review.yml\` if the review needs them)."
            fi
            echo
            echo "Ask for another pass by commenting \`@claude review this PR\`."
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
