name: Claude Code Review

# Reviews each non-draft PR against CLAUDE.md. Posts line findings as inline
# comments and one summary comment. track_progress makes the action post a
# progress comment and update it with the result, so a review comment exists
# even when Claude's own gh pr comment call is denied. The last step fails the
# job if Claude posted no comment in this run, or if the review has content
# under "### Blocking". This is the standard review of the unibrain1 repos.
#
# Skipped: draft PRs, Dependabot PRs (Dependabot runs get no secrets), and
# titles that contain [skip-review].
#
# The action does not run when a PR changes this file (the PR copy differs
# from main). A person must review such a PR. The change takes effect after
# the merge.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip-review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record run start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for mock-brevo: a local mock of the
            Brevo (ex-Sendinblue) transactional API that client apps point at
            instead of api.brevo.com in dev and tests. Stack: Java 25, Spring Boot
            4.1 (Web MVC), Jackson 3, Spring Data JPA + H2 in file mode, Lombok,
            and a plain static HTML/JS admin UI (no build step). Read CLAUDE.md
            first; it documents the invariants below.

            Get the PR description and diff:
            ```bash
            gh pr view ${{ github.event.pull_request.number }}
            gh pr diff ${{ github.event.pull_request.number }}
            ```

            Skip `package-lock.json`, `node_modules/**` and `mvnw.cmd`. CI already
            runs the build, tests and linters; don't re-run them.

            ## What to check

            ### Brevo API contract (highest priority)
            - JSON field names, presence and types must match Brevo's API exactly;
              the Brevo PHP SDK deserializes strictly.
            - Request DTO records carry `@JsonIgnoreProperties(ignoreUnknown = true)`.
            - Changes under `src/test/resources/api-shapes/` mean the JSON contract
              changed. Each one must be intended and explained in the PR; treat an
              unexplained shape change as Blocking.
            - New `/v3/**` endpoints need a `capture(...)` in `ApiShapeSnapshotTest`.

            ### Tenant isolation
            - Every `/v3/**` controller method calls `CurrentAccount.require()` first
              and scopes every query by account. Any lookup by id that doesn't check
              the account (data from another api-key leaking) is Blocking.
            - Only a missing/blank `api-key` returns 401; any other key provisions an
              account.

            ### Persistence
            - Methods that walk lazy JPA relations use
              `org.springframework.transaction.annotation.Transactional`, not
              `jakarta.transaction.Transactional` (`open-in-view` is off).
            - Never add `AUTO_SERVER=TRUE` to the H2 URL.
            - Schema/entity changes must still open an existing H2 file created by
              the last release (`ddl-auto: update`).

            ### Security and safety
            - Raw api-keys are never logged; the request log masks them.
            - Nothing sends real email. The only outbound mail path is the opt-in
              `SmtpForwarder` (off by default), for a local catcher.
            - GitHub Actions: no untrusted input (PR title/body, branch names) inside
              `run:` scripts; pass it through `env:`.

            ### Admin UI (`src/main/resources/static/`)
            - Every user-visible string goes through `I18N.t()` or a `data-i18n*`
              attribute, with the key present in both the `fr` and `en` dictionaries
              in `js/i18n.js`.
            - Dynamic values inserted into HTML are escaped with `esc()`; only
              dictionary keys ending in `Html` may be inserted unescaped.
            - Nothing shadows the `t` translator in `app.js`.

            ### Tests
            New non-trivial logic (endpoints, account scoping, parsing, UI behaviour)
            should have tests: MockMvc in `BrevoApiTest`, shape snapshots, or
            Playwright in `tests/ui/`.

            ## What to skip
            - Formatting and style (not enforced by design)
            - Anything the compiler, SpotBugs or the linters would already flag

            Output:
            1. For each finding on a specific line, post an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
               Put each inline finding in the summary too, under its heading,
               with the file and the line. The gate reads only the summary.
            2. Write one summary to `/tmp/claude-review.md` with the Write tool.
               Start it with the heading `## Claude review`. Then use these
               headings, and leave out each heading that has no content:
               - `### Blocking`: a bug, a security problem, or a break of a
                 CLAUDE.md rule. The job fails while this section has content.
               - `### Important`: a real risk, or a missing test or doc update.
               - `### Suggestions`: an optional improvement.
               - `### Strengths`: what the PR does well.
               If there are no findings, write only "No issues found." after the
               first heading. Do not write "None" under a heading.
            3. Post the summary with this one-line command:

                 gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/claude-review.md

               Do not put the summary text in the command. A command with more
               than one line is denied. Post the summary before you end the turn.
            4. Report only findings that you checked in the code. Give the file
               and the line for each finding.

            Post only GitHub comments. Do not send the review as a message.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Write,Grep,Glob"

      - name: Fail if no review was posted, or if it has Blocking findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          STARTED: ${{ steps.start.outputs.time }}
        run: |
          # Use only Claude comments from this run: the track_progress comment
          # and the summary comment. Comments from earlier runs, from people,
          # and error comments do not count. Without a start time, the check
          # fails.
          if [ -z "$STARTED" ]; then
            echo "::error::No run start time. Cannot check for a review from this run."
            exit 1
          fi
          gh api --paginate "repos/${REPO}/issues/${PR_NUM}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | select(.created_at >= env.STARTED) | select(.body | contains("Claude encountered an error") | not) | .body' \
            > "$RUNNER_TEMP/review.md"
          if [ ! -s "$RUNNER_TEMP/review.md" ]; then
            # The action does not run when this file on the PR head differs
            # from main. Give a warning only when that is the cause: no
            # execution file, and the two blob SHAs differ. An empty lookup
            # counts as no. A 404 on main means that this PR adds the file.
            WF_PATH='.github/workflows/claude-code-review.yml'
            MAIN_BLOB=$(gh api "repos/${REPO}/contents/${WF_PATH}?ref=main" --jq .sha 2>"$RUNNER_TEMP/main_err" || true)
            if [ -z "$MAIN_BLOB" ] && grep -q 'HTTP 404' "$RUNNER_TEMP/main_err"; then
              MAIN_BLOB=none
            fi
            HEAD_BLOB=$(gh api "repos/${REPO}/contents/${WF_PATH}?ref=${HEAD_SHA}" --jq .sha 2>/dev/null || true)
            if [ -z "$EXECUTION_FILE" ] && [ -n "$MAIN_BLOB" ] && [ -n "$HEAD_BLOB" ] \
               && [ "$MAIN_BLOB" != "$HEAD_BLOB" ]; then
              echo "::warning::No review posted. The action did not run, because ${WF_PATH} on this PR differs from main. A person must review this PR."
              exit 0
            fi
            echo "::error::No Claude review comment from this run found on this PR (run started ${STARTED})."
            exit 1
          fi
          # The prompt says to leave out an empty section. It cannot make sure
          # of that, so an empty Blocking section ("None", "N/A", "No issues
          # found.") does not count.
          SECTION=$(awk '
            /^#{1,6}[[:space:]]+Blocking[[:space:]]*$/ { capture=1; next }
            /^#{1,6}[[:space:]]/ { capture=0 }
            capture { print }
          ' "$RUNNER_TEMP/review.md")
          NORMALIZED=$(echo "$SECTION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | sed -E 's/^(none\.?|n\/a\.?|-|noissuesfound\.?)+$//')
          if [ -n "$NORMALIZED" ]; then
            echo "::error::Review posted Blocking findings. Fix them before merging; see the PR comment."
            exit 1
          fi
          echo "No Blocking findings in the review."
