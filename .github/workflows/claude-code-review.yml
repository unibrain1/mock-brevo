name: Claude code review

# Automatic PR review, modelled on MyGunLog's issue-level review:
# - track_progress posts a live checklist comment on the PR that becomes the review
# - a repo-specific checklist (from CLAUDE.md) instead of a generic prompt
# - fixed headings: Blocking / Important / Suggestions / Strengths
# - CI gate: the job fails if the review's "Blocking" section has content
#
# Runs on every non-draft push. Skipped for Dependabot PRs (no access to
# secrets) and for titles containing [skip-review] or [WIP].
# Ask for a follow-up at any time by commenting `@claude ...` (claude.yml).
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub App
# (`/install-github-app`). The action only runs when this file matches the
# copy on the default branch, so edits to it skip their own PR's review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools
            "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for mock-brevo: a local mock of the
            Brevo (ex-Sendinblue) transactional API that client apps point at
            instead of api.brevo.com in dev and tests. Stack: Java 25, Spring Boot
            4.1 (Web MVC), Jackson 3, Spring Data JPA + H2 in file mode, Lombok,
            and a plain static HTML/JS admin UI (no build step). Read CLAUDE.md
            first; it documents the invariants below.

            Get the PR description and diff:
            ```bash
            gh pr view ${{ github.event.pull_request.number }}
            gh pr diff ${{ github.event.pull_request.number }}
            ```

            Skip `package-lock.json`, `node_modules/**` and `mvnw.cmd`. CI already
            runs the build, tests and linters; don't re-run them.

            ## What to check

            ### Brevo API contract (highest priority)
            - JSON field names, presence and types must match Brevo's API exactly;
              the Brevo PHP SDK deserializes strictly.
            - Request DTO records carry `@JsonIgnoreProperties(ignoreUnknown = true)`.
            - Changes under `src/test/resources/api-shapes/` mean the JSON contract
              changed. Each one must be intended and explained in the PR; treat an
              unexplained shape change as Blocking.
            - New `/v3/**` endpoints need a `capture(...)` in `ApiShapeSnapshotTest`.

            ### Tenant isolation
            - Every `/v3/**` controller method calls `CurrentAccount.require()` first
              and scopes every query by account. Any lookup by id that doesn't check
              the account (data from another api-key leaking) is Blocking.
            - Only a missing/blank `api-key` returns 401; any other key provisions an
              account.

            ### Persistence
            - Methods that walk lazy JPA relations use
              `org.springframework.transaction.annotation.Transactional`, not
              `jakarta.transaction.Transactional` (`open-in-view` is off).
            - Never add `AUTO_SERVER=TRUE` to the H2 URL.
            - Schema/entity changes must still open an existing H2 file created by
              the last release (`ddl-auto: update`).

            ### Security and safety
            - Raw api-keys are never logged; the request log masks them.
            - Nothing sends real email. The only outbound mail path is the opt-in
              `SmtpForwarder` (off by default), for a local catcher.
            - GitHub Actions: no untrusted input (PR title/body, branch names) inside
              `run:` scripts; pass it through `env:`.

            ### Admin UI (`src/main/resources/static/`)
            - Every user-visible string goes through `I18N.t()` or a `data-i18n*`
              attribute, with the key present in both the `fr` and `en` dictionaries
              in `js/i18n.js`.
            - Dynamic values inserted into HTML are escaped with `esc()`; only
              dictionary keys ending in `Html` may be inserted unescaped.
            - Nothing shadows the `t` translator in `app.js`.

            ### Tests
            New non-trivial logic (endpoints, account scoping, parsing, UI behaviour)
            should have tests: MockMvc in `BrevoApiTest`, shape snapshots, or
            Playwright in `tests/ui/`.

            ## What to skip
            - Formatting and style (not enforced by design)
            - Anything the compiler, SpotBugs or the linters would already flag

            ## Output

            Post your review as a PR comment:
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "..."
            ```

            Use exactly these headings, and omit any section with no content (do
            NOT include an empty section or write "None"):

            ### Blocking
            Bugs, contract breaks, tenant-isolation or security problems, CLAUDE.md
            rule violations. Must fix before merge.

            ### Important
            Design gaps, missing tests for non-trivial logic, real maintenance risk.

            ### Suggestions
            Optional improvements.

            ### Strengths
            What's done well.

            Each item cites `file:line` and the specific rule or reason.
            Only post GitHub comments; do not output the review as a message.

      - name: Fail if Blocking findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(gh api "repos/${REPO}/issues/${PR_NUM}/comments" \
            --jq 'last.body // ""' 2>/dev/null || echo "")
          # The prompt asks for empty sections to be omitted, but can't guarantee
          # it, so check the Blocking section has real content (not "None"/"N/A").
          SECTION=$(echo "$BODY" | awk '
            /^#{1,6}[[:space:]]+Blocking[[:space:]]*$/ { capture=1; next }
            /^#{1,6}[[:space:]]/ { if (capture) exit }
            capture { print }
          ')
          NORMALIZED=$(echo "$SECTION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | sed -E 's/^(none\.?|n\/a\.?|-)+$//')
          if [ -n "$NORMALIZED" ]; then
            echo "::error::Review posted Blocking findings. Fix them before merging; see the PR comment."
            exit 1
          fi
          echo "No Blocking findings in the review."
