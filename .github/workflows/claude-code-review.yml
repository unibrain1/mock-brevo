name: Claude code review

# Automatic PR review with Anthropic's official code-review plugin: parallel
# CLAUDE.md-compliance and bug-hunting agents, then a validation pass that drops
# anything it can't confirm, so only high-signal issues are posted inline.
# Repo-specific review rules live in CLAUDE.md (the plugin enforces them).
#
# The plugin reviews a PR once and skips PRs Claude has already commented on,
# so later pushes aren't re-reviewed; ask for another pass by commenting
# `@claude review this PR again` (handled by claude.yml).
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub App
# (`/install-github-app`). The action only runs when this file matches the
# copy on the default branch, so edits to it skip their own PR's review.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are reviewed when marked ready; Dependabot PRs can't read secrets.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # Mirrors the plugin command's own allowed-tools list.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
