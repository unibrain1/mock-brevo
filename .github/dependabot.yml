version: 2

# All ecosystems run Monday 04:00 Pacific so PRs are open before the Monday dashboard email.
# PRs are assigned to the repo owner so GitHub notifies them.
# Each entry waits 7 days after a release (cooldown), so that a bad or compromised release can be found before Dependabot opens a PR for it.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    assignees: [unibrain1]
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework.*"
          - "org.springframework.boot*"
      test:
        patterns:
          - "org.junit.*"
          - "org.mockito.*"
          - "*:spring-boot-starter-test"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    assignees: [unibrain1]
    open-pull-requests-limit: 3
    groups:
      lint-and-test-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    assignees: [unibrain1]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    assignees: [unibrain1]
    open-pull-requests-limit: 2
    # The project targets Java 25 LTS. JDK 26-28 are not LTS releases. A move to the next LTS is a person's decision, not a Dependabot PR.
    # Dependabot reads maven:3.9-eclipse-temurin-25 as version 3.9 with a suffix, so semver-major does not stop a JDK change there. The tags are listed by name.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        versions:
          - "3.9-eclipse-temurin-26"
          - "3.9-eclipse-temurin-27"
          - "3.9-eclipse-temurin-28"
